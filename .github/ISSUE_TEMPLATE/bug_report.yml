name: Bug report
description: Report something that is broken in ViaBay
title: "[Bug]: "
labels: ["Bug"]
type: "Bug"
body:
    - type: markdown
      attributes:
          value: |
              Thanks for reporting a bug. Please fill in as much as you can so we can reproduce it.

    - type: textarea
      id: description
      attributes:
          label: What happened?
          description: A clear description of the bug.
      validations:
          required: true

    - type: textarea
      id: steps
      attributes:
          label: Steps to reproduce
          placeholder: |
              1. Go to '...'
              2. Click on '...'
              3. See error
      validations:
          required: true

    - type: textarea
      id: expected
      attributes:
          label: Expected behavior
          description: What did you expect to happen?
      validations:
          required: true

    - type: dropdown
      id: area
      attributes:
          label: Area
          description: Which part of the app is affected?
          options:
              - Tracker / live vehicles
              - Directions / routing
              - Map
              - Notifications
              - Book
              - More
              - Authentication / sign-in
              - Settings / theme
              - 511.org API
              - Other
      validations:
          required: true

    - type: input
      id: agency-route
      attributes:
          label: Agency and route
          description: For example SF Muni / N Judah. Leave blank if not applicable.
          placeholder: SF Muni / N Judah

    - type: input
      id: url
      attributes:
          label: Page URL
          placeholder: https://.../directions

    - type: textarea
      id: logs
      attributes:
          label: Console or server errors
          description: Paste any browser console output or error messages.
          render: shell

    - type: textarea
      id: screenshots
      attributes:
          label: Screenshots or recordings
          description: Drag and drop images or videos here.

    - type: input
      id: browser
      attributes:
          label: Browser and version
          placeholder: Chrome 130

    - type: dropdown
      id: device
      attributes:
          label: Device
          options:
              - Desktop
              - Mobile
              - Tablet
      validations:
          required: true

    - type: textarea
      id: context
      attributes:
          label: Additional context
          description: Anything else that might help.
