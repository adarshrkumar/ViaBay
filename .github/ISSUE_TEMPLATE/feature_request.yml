name: Feature request
description: Suggest an idea or improvement for ViaBay
title: "[Feature]: "
labels: ["Feature Request"]
type: "Feature"
body:
    - type: markdown
      attributes:
          value: |
              Thanks for suggesting a feature. Please describe the problem you want solved, not just the solution.

    - type: textarea
      id: problem
      attributes:
          label: Problem or motivation
          description: What are you trying to do that is hard or impossible today?
          placeholder: I want to ... but ...
      validations:
          required: true

    - type: textarea
      id: solution
      attributes:
          label: Proposed solution
          description: Describe how you would like this to work.
      validations:
          required: true

    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives considered
          description: Any other approaches or workarounds you have tried or thought about.

    - type: dropdown
      id: area
      attributes:
          label: Area
          description: Which part of the app does this relate to?
          options:
              - Tracker / live vehicles
              - Directions / routing
              - Map
              - Notifications
              - Book
              - More
              - Authentication / sign-in
              - Settings / theme
              - New transit agency
              - Accessibility
              - Other
      validations:
          required: true

    - type: input
      id: agency-route
      attributes:
          label: Agency and route
          description: For example SF Muni / N Judah. Leave blank if not applicable.
          placeholder: SF Muni / N Judah

    - type: dropdown
      id: importance
      attributes:
          label: How important is this to you?
          options:
              - Nice to have
              - Would improve my workflow
              - Blocking me from using ViaBay effectively
      validations:
          required: true

    - type: textarea
      id: mockups
      attributes:
          label: Mockups or references
          description: Drag and drop images, or link to similar features in other apps.

    - type: textarea
      id: context
      attributes:
          label: Additional context
          description: Anything else that might help.
